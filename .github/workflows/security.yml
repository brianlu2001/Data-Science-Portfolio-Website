name: Security checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:backend
      - run: npm run test:security
      - run: npm audit --audit-level=low
      - run: npm run build
      - name: Reject credential-bearing database dumps
        run: |
          if git grep -I -l -E '"(access_token|refresh_token)"[[:space:]]*:' -- '*.sql'; then
            echo 'Credential-bearing SQL dump detected'
            exit 1
          fi
